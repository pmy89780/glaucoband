<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cv=document.createElement('canvas'),ctx=cv.getContext('2d');
let S={img:null,orig:null,name:'',p:null,c:null,scale:null,manual:false,dir:1,side:0,rl:5,drag:null,eye:'OD',asv:0};
const MAXW=1100;
function getScale(){return S.scale||cv.width/40;}

function boxBlur(g,w,h,r){
 const t=new Float32Array(w*h),o=new Float32Array(w*h);
 for(let y=0;y<h;y++){let s=0,c=0;const b=y*w;
  for(let x=-r;x<w;x++){const a=x+r,d=x-r-1;if(a<w){s+=g[b+a];c++;}if(d>=0){s-=g[b+d];c--;}if(x>=0)t[b+x]=s/c;}}
 for(let x=0;x<w;x++){let s=0,c=0;
  for(let y=-r;y<h;y++){const a=y+r,d=y-r-1;if(a<h){s+=t[a*w+x];c++;}if(d>=0){s-=t[d*w+x];c--;}if(y>=0)o[y*w+x]=s/c;}}
 return o;}
function pctl(vals,p){const hs=new Array(256).fill(0);vals.forEach(v=>hs[v|0]++);let a=0;for(let i=0;i<256;i++){a+=hs[i];if(a>vals.length*p)return i;}return 255;}
function findPupil(g,w,h){
 // stage 1: locate the eye as the largest dark blob
 const x0=~~(w*.05),x1=~~(w*.85),y0=~~(h*.15),y1=~~(h*.85),v=[];
 for(let y=y0;y<y1;y+=2)for(let x=x0;x<x1;x+=2)v.push(g[y*w+x]);
 const th=pctl(v,.05),st=4,gw=Math.ceil(w/st),gh=Math.ceil(h/st),lab=new Int32Array(gw*gh);
 let best=null,id=0;
 for(let gy=~~(y0/st);gy<y1/st;gy++)for(let gx=~~(x0/st);gx<x1/st;gx++){
  const k=gy*gw+gx;if(lab[k]||g[gy*st*w+gx*st]>th)continue;
  id++;const q=[k];lab[k]=id;let sx=0,sy=0,c=0;
  while(q.length){const t=q.pop(),tx=t%gw,ty=(t/gw)|0;sx+=tx;sy+=ty;c++;
   for(const[ax,ay]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=tx+ax,ny=ty+ay;
    if(nx<0||ny<0||nx>=gw||ny>=gh)continue;const nk=ny*gw+nx;
    if(lab[nk]||g[ny*st*w+nx*st]>th)continue;lab[nk]=id;q.push(nk);}}
  if(!best||c>best.c)best={c,x:sx/c*st,y:sy/c*st};}
 if(!best)best={c:0,x:w/2,y:h/2};
 // stage 2: dark core of the iris/pupil inside a window around the eye (thin lashes/liner removed by erosion)
 const R=Math.round(w*.19),ax=Math.max(0,Math.round(best.x-R)),bx=Math.min(w,Math.round(best.x+R)),ay=Math.max(0,Math.round(best.y-R)),by=Math.min(h,Math.round(best.y+R)),ww=bx-ax,wh=by-ay;
 const wv=[];for(let y=0;y<wh;y++)for(let x=0;x<ww;x++)wv.push(g[(ay+y)*w+ax+x]);
 const th2=pctl(wv,.20),er=Math.max(2,Math.round(w*.011)),m=new Uint8Array(ww*wh);
 for(let i=0;i<ww*wh;i++)m[i]=wv[i]<=th2?1:0;
 const e1=new Uint8Array(ww*wh),e2=new Uint8Array(ww*wh),L=2*er+1;
 for(let y=0;y<wh;y++){const p=new Int32Array(ww+1);for(let x=0;x<ww;x++)p[x+1]=p[x]+m[y*ww+x];
  for(let x=er;x<ww-er;x++)if(p[x+er+1]-p[x-er]==L)e1[y*ww+x]=1;}
 for(let x=0;x<ww;x++){const p=new Int32Array(wh+1);for(let y=0;y<wh;y++)p[y+1]=p[y]+e1[y*ww+x];
  for(let y=er;y<wh-er;y++)if(p[y+er+1]-p[y-er]==L)e2[y*ww+x]=1;}
 const lb=new Int32Array(ww*wh);let top=null,nid=0;
 for(let s=0;s<ww*wh;s++){if(!e2[s]||lb[s])continue;nid++;lb[s]=nid;const q=[s];let sx=0,sy=0,c=0;
  while(q.length){const t=q.pop(),tx=t%ww,ty=(t/ww)|0;sx+=tx;sy+=ty;c++;
   for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=tx+dx,ny=ty+dy;if(nx<0||ny<0||nx>=ww||ny>=wh)continue;const k=ny*ww+nx;if(!e2[k]||lb[k])continue;lb[k]=nid;q.push(k);}}
  if(!top||c>top.c)top={c,x:sx/c,y:sy/c};}
 if(!top)return{x:best.x,y:best.y,r:w*.04,dia:w*.1};
 const dia=2*Math.sqrt(top.c/Math.PI)+2*er;
 return{x:ax+top.x,y:ay+top.y,r:dia/4,dia};
}
function isY(d,i){return d[i]>170&&d[i+1]>150&&d[i+2]<120&&d[i]-d[i+2]>110}
function ruler(d,w,h){const col=new Int32Array(w);for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(isY(d,4*(y*w+x)))col[x]++;
 let bx=0;for(let x=0;x<w;x++)if(col[x]>col[bx])bx=x;if(col[bx]<h*.08)return null;let y0=h,y1=-1;
 for(let x=Math.max(0,bx-8);x<=Math.min(w-1,bx+8);x++)for(let y=0;y<h;y++)if(isY(d,4*(y*w+x))){if(y<y0)y0=y;if(y>y1)y1=y}
 return y1-y0>h*.1?{x:bx,y0,y1,len:y1-y0}:null}
function comps(m,gw,gh,minc){const lab=new Int32Array(gw*gh),out=[];let id=0;
 for(let s=0;s<gw*gh;s++){if(!m[s]||lab[s])continue;id++;lab[s]=id;const q=[s],px=[];
  while(q.length){const t=q.pop(),tx=t%gw,ty=(t/gw)|0;px.push(t);
   for(const[a,b]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=tx+a,ny=ty+b;if(nx<0||ny<0||nx>=gw||ny>=gh)continue;const k=ny*gw+nx;if(!m[k]||lab[k])continue;lab[k]=id;q.push(k)}}
  if(px.length>=minc)out.push(px)}return out}
function locate(d,g,w,h){const st=3,gw=Math.ceil(w/st),gh=Math.ceil(h/st),m=new Uint8Array(gw*gh);
 for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){const X=x*st,Y=y*st;if(X<6||Y<h*.1||Y>h*.9)continue;const i=4*(Y*w+X),mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);if(mx>170&&(mx-mn)/(mx+1)<.22)m[y*gw+x]=1}
 const cs=comps(m,gw,gh,40).sort((a,b)=>b.length-a.length);if(!cs.length)return null;
 const sc=cs[0];let x0=1e9,x1=-1,cy=0;const scl=new Uint8Array(gw*gh);sc.forEach(t=>{const x=t%gw,y=(t/gw)|0;scl[t]=1;x0=Math.min(x0,x);x1=Math.max(x1,x);cy+=y});cy=cy/sc.length*st;x0*=st;x1*=st;
 const ax=Math.max(0,Math.round(x0-.25*w)),bx=Math.min(w,Math.round(x1+.3*w)),ay=Math.max(0,Math.round(cy-.15*h)),by=Math.min(h,Math.round(cy+.15*h));
 const vals=[];for(let y=ay;y<by;y+=3)for(let x=ax;x<bx;x+=3)if(!scl[((y/st)|0)*gw+((x/st)|0)])vals.push(g[y*w+x]);
 const th=pctl(vals,.40),dm=new Uint8Array(gw*gh),er=2;
 for(let y=(ay/st)|0;y<by/st;y++)for(let x=(ax/st)|0;x<bx/st;x++){const k=y*gw+x;if(!scl[k]&&g[y*st*w+x*st]<=th)dm[k]=1}
 const e=new Uint8Array(gw*gh);for(let y=er;y<gh-er;y++)for(let x=er;x<gw-er;x++){let ok=1;for(let a=-er;a<=er&&ok;a++)for(let b=-er;b<=er;b++)if(!dm[(y+a)*gw+x+b]){ok=0;break}e[y*gw+x]=ok}
 let best=null;for(const c of comps(e,gw,gh,12)){let sx=0,sy=0;c.forEach(t=>{sx+=t%gw;sy+=(t/gw)|0});sx=sx/c.length*st;sy=sy/c.length*st;
  const dx=sx<x0?x0-sx:sx>x1?sx-x1:0;if(dx>.22*w)continue;const s=c.length/(1+dx/w*4);if(!best||s>best.s)best={s,x:sx,y:sy}}
 if(!best)return null;const dir=best.x>(x0+x1)/2?1:-1,yr=Math.round(best.y);
 let xl=Math.round(best.x);while(xl>0&&xl<w-1&&!scl[((yr/st)|0)*gw+((xl/st)|0)])xl-=dir;if(xl<=0||xl>=w-1)xl=Math.round(dir>0?x1:x0);
 let mg=0;const gr=[];for(let x=xl+dir*Math.round(.05*w);x>2&&x<w-3&&Math.abs(x-xl)<.3*w;x+=dir){let s=0;for(let k=-3;k<=3;k++){const r=Math.min(h-1,Math.max(0,yr+k));s+=g[r*w+x+dir*2]-g[r*w+x-dir*2]}const q=Math.abs(s/7);gr.push([x,q]);if(q>mg)mg=q}
 if(!gr.length)return null;let apex=gr[0][0];for(const[x,q]of gr)if(q>mg*.6){apex=x;break}
 return{dir,y:yr,xl,apex,px:Math.round((xl+apex)/2),iris:Math.abs(apex-xl)}}

function detect(){
 const w=cv.width,h=cv.height,o=document.createElement('canvas');o.width=w;o.height=h;
 const oc=o.getContext('2d');oc.drawImage(S.img,0,0,w,h);
 const d=oc.getImageData(0,0,w,h).data;let g=new Float32Array(w*h);
 for(let i=0;i<w*h;i++)g[i]=.299*d[4*i]+.587*d[4*i+1]+.114*d[4*i+2];
 g=boxBlur(g,w,h,Math.max(2,Math.round(w*.004)));
 const L=locate(d,g,w,h),RL=ruler(d,w,h);
 if(L&&L.dir==S.dir){S.p={x:L.px,y:L.y};S.pr=L.iris/4;S.apex=L.apex;S.c={x:L.apex,y:L.y};S.edge=9;S.loc=1;S.iw=L.iris;S.scale=RL?RL.len/(S.rl*10):L.iris/9;S.sc=RL?'ruler':'iris';S.rul=RL;return render()}
 S.loc=0;S.sc='pupil';S.rul=null;
 const P=findPupil(g,w,h);
 S.p={x:P.x,y:P.y};S.pr=P.r;
 if(!S.manual)S.scale=Math.max(2,P.dia/9.5);
 const dir=S.dir,row=Math.round(S.p.y);let maxg=0;const gr=[];
 for(let x=Math.round(S.p.x+dir*S.pr*1.3);x>2&&x<w-3;x+=dir){
  let s=0;for(let yy=-3;yy<=3;yy++){const r=Math.min(h-1,Math.max(0,row+yy));s+=g[r*w+x+dir*2]-g[r*w+x-dir*2];}
  const q=Math.abs(s/7);gr.push([x,q]);if(q>maxg)maxg=q;}
 let apex=gr.length?gr[0][0]:S.p.x+dir*S.pr*2;
 for(const[x,q]of gr){if(q>maxg*.6){apex=x;break;}}
 S.edge=maxg/(gr.reduce((a,b)=>a+b[1],0)/(gr.length||1)+1e-3);S.apex=apex;placeCC();
}
function detectOld(){
 const w=cv.width,h=cv.height;
 const o=document.createElement('canvas');o.width=w;o.height=h;
 const oc=o.getContext('2d');oc.filter='blur(3px)';oc.drawImage(S.img,0,0,w,h);
 const d=oc.getImageData(0,0,w,h).data;
 const g=new Float32Array(w*h);
 for(let i=0;i<w*h;i++)g[i]=.299*d[4*i]+.587*d[4*i+1]+.114*d[4*i+2];
 // central search region
 const x0=Math.round(w*.15),x1=Math.round(w*.85),y0=Math.round(h*.15),y1=Math.round(h*.85);
 const hist=new Array(256).fill(0);let n=0;
 for(let y=y0;y<y1;y+=2)for(let x=x0;x<x1;x+=2){hist[g[y*w+x]|0]++;n++;}
 let acc=0,th=0;for(let i=0;i<256;i++){acc+=hist[i];if(acc>n*.05){th=i;break;}}
 // connected components on a step-4 grid
 const st=4,gw=Math.ceil(w/st),gh=Math.ceil(h/st),lab=new Int32Array(gw*gh);
 let best=null,id=0;
 for(let gy=Math.floor(y0/st);gy<y1/st;gy++)for(let gx=Math.floor(x0/st);gx<x1/st;gx++){
  const k=gy*gw+gx;if(lab[k]||g[gy*st*w+gx*st]>th)continue;
  id++;const q=[k];lab[k]=id;let sx=0,sy=0,c=0,minx=1e9,maxx=-1;
  while(q.length){const t=q.pop(),tx=t%gw,ty=(t/gw)|0;sx+=tx;sy+=ty;c++;minx=Math.min(minx,tx);maxx=Math.max(maxx,tx);
   for(const[ax,ay]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=tx+ax,ny=ty+ay;
    if(nx<0||ny<0||nx>=gw||ny>=gh)continue;const nk=ny*gw+nx;
    if(lab[nk]||g[ny*st*w+nx*st]>th)continue;lab[nk]=id;q.push(nk);}}
  const cx=sx/c*st,cy=sy/c*st,dist=Math.hypot(cx-w/2,cy-h/2)/w;
  const score=c*(1-dist);
  if(!best||score>best.score)best={score,cx,cy,r:(maxx-minx+1)*st/2};
 }
 if(!best)best={cx:w/2,cy:h/2,r:w/20};
 S.p={x:best.cx,y:best.cy};S.pr=best.r;
 // corneal apex: strongest outer edge along pupil row in the projecting direction
 const dir=+$('side').value,row=Math.round(S.p.y);
 let maxg=0;const gr=[];
 const start=Math.round(S.p.x+dir*S.pr*1.3);
 for(let x=start;x>2&&x<w-3;x+=dir){
  let s=0;for(let yy=-3;yy<=3;yy++){const r=Math.min(h-1,Math.max(0,row+yy));s+=g[r*w+x+dir*2]-g[r*w+x-dir*2];}
  const v=Math.abs(s/7);gr.push([x,v]);if(v>maxg)maxg=v;}
 let apex=gr.length?gr[0][0]:S.p.x+dir*S.pr*2;
 for(const[x,v]of gr){if(v>maxg*.6){apex=x;break;}}
 S.apex=apex;
 placeCC();
}
function placeCC(){
 const dir=+$('side').value,R=7.8*getScale();
 S.c={x:S.apex-dir*R,y:S.p.y};render();
}

const TF=typeof tf!='undefined';let RM=null,CM=null;
const feat=(a,u)=>[a-2.5,u.a/100,u.hy,u.fh,u.s=='F'?1:0],CI={Low:0,Moderate:1,High:2,Critical:3};
function rk(a,u){if(!RM)return risk(a,u);const p=tf.tidy(()=>RM.predict(tf.tensor2d([feat(a,u)])).dataSync()),pct=Math.min(99,Math.round(p[0]*12+p[1]*37+p[2]*62+p[3]*87)),t=D.set.t;return{pct,cat:pct<t[0]?'Low':pct<t[1]?'Moderate':pct<t[2]?'High':'Critical',ai:1}}
function setGT(id,v){D.M.find(m=>m.id==id).gt=v===''?null:+v;persist();toast('Diagnosis label saved')}

const prep=(im,dir,sz=64)=>tf.tidy(()=>{const c=document.createElement('canvas');c.width=320;c.height=Math.max(1,Math.round(320*(im.naturalHeight||im.height)/(im.naturalWidth||im.width)));c.getContext('2d').drawImage(im,0,0,c.width,c.height);
 let x=tf.image.resizeBilinear(tf.browser.fromPixels(c,3).toFloat().mul(tf.tensor1d([.299,.587,.114])).sum(-1,true),[sz,sz]).div(255);if(dir<0)x=x.reverse(1);return x.expandDims(0)});
const loadImg=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s});

function aiSuggest(){S.ai=null;if(!CM||!S.img)return;const o=tf.tidy(()=>CM.predict(prep(S.img,S.dir,CM.inputs[0].shape[1])).dataSync()),w=cv.width,h=cv.height;let[a,b,c]=o;if(S.dir<0){a=1-a;c=1-c}S.ai={px:a*w,py:b*h,cx:c*w};S.ai.mm=Math.abs(S.ai.px-S.ai.cx)/getScale()+D.set.off;showRes(0)}
function useAI(){S.p={x:S.ai.px,y:S.ai.py};S.c={x:S.ai.cx,y:S.ai.py};S.apex=S.c.x+S.dir*7.8*getScale();S.ai=null;render()}

async function trainRisk(){
 const X=[],Y=[];D.M.forEach(m=>{if(m.gt!=null){X.push(feat(m.acd,usr(m.pid)));Y.push(m.gt)}});const n=X.length;
 if(n<20)return toast(`Need 20+ doctor-confirmed scans (have ${n})`);
 const net=tf.sequential();net.add(tf.layers.dense({units:16,activation:'relu',inputShape:[5]}));net.add(tf.layers.dense({units:8,activation:'relu'}));net.add(tf.layers.dense({units:4,activation:'softmax'}));net.compile({optimizer:tf.train.adam(.01),loss:'categoricalCrossentropy',metrics:['accuracy']});
 const h=await net.fit(tf.tensor2d(X),tf.oneHot(tf.tensor1d(Y,'int32'),4),{epochs:60,batchSize:8,shuffle:true,validationSplit:.2,callbacks:{onEpochEnd:(e,l)=>{if($('tlog'))$('tlog').textContent=`Risk net epoch ${e+1}/60, loss ${l.loss.toFixed(3)}`}}});
 const va=h.history.val_acc||h.history.val_accuracy;RM=net;await net.save('indexeddb://gb-risk');D.mdl={at:day(0),n,acc:va[va.length-1]};persist();toast('Risk network trained and active');view()}
async function trainCNN(){const ms=D.M.filter(m=>m.th&&m.k);if(ms.length<12)return toast(`Need 12+ saved scans with photos (have ${ms.length})`);
 const xs=[],ys=[];for(const m of ms){xs.push(prep(await loadImg(m.th),m.dir));const[a,b,c]=m.k;ys.push(m.dir<0?[1-a,b,1-c]:[a,b,c])}
 const net=tf.sequential();net.add(tf.layers.conv2d({inputShape:[64,64,1],filters:8,kernelSize:3,activation:'relu'}));net.add(tf.layers.maxPooling2d({poolSize:2}));net.add(tf.layers.conv2d({filters:16,kernelSize:3,activation:'relu'}));net.add(tf.layers.maxPooling2d({poolSize:2}));net.add(tf.layers.flatten());net.add(tf.layers.dropout({rate:.3}));net.add(tf.layers.dense({units:32,activation:'relu'}));net.add(tf.layers.dense({units:3,activation:'sigmoid'}));net.compile({optimizer:tf.train.adam(.003),loss:'meanSquaredError'});
 const h=await net.fit(tf.concat(xs),tf.tensor2d(ys),{epochs:80,batchSize:4,shuffle:true,callbacks:{onEpochEnd:(e,l)=>{if($('tlog'))$('tlog').textContent=`CNN epoch ${e+1}/80, loss ${l.loss.toFixed(4)}`}}});
 CM=net;await net.save('indexeddb://gb-loc');D.cnn={at:day(0),n:ms.length,loss:h.history.loss.slice(-1)[0]};persist();toast('CNN trained and active');view()}
async function importM(){const f=[...$('imp').files],k=$('impk').value;if(f.length<2)return toast('Select model.json and its .bin file(s) together');
 try{const m=await tf.loadLayersModel(tf.io.browserFiles(f)),i=m.inputs[0].shape,o=m.outputs[0].shape;
  if(k=='gb-risk'){if(i[1]!=5||o[1]!=4)throw new Error('Risk model must take 5 inputs and output 4 classes');RM=m;D.mdl={at:day(0),imp:1}}
  else{if(i.length!=4||i[3]!=1||o[1]!=3)throw new Error('Localiser must take a grey image and output 3 values');CM=m;D.cnn={at:day(0),imp:1}}
  await m.save('indexeddb://'+k);persist();toast('Model imported and active');view()}catch(e){toast('Import failed: '+(e.message||e))}}
function resetM(k){tf.io.removeModel('indexeddb://'+k).catch(()=>{});if(k=='gb-risk'){RM=null;delete D.mdl}else{CM=null;delete D.cnn}persist();view()}
V.model=()=>{const gt=D.M.filter(m=>m.gt!=null).length,ph=D.M.filter(m=>m.th&&m.k).length;return`<div class="card"><h2>TensorFlow.js models</h2><p class="mut">Both models train and run inside this browser; no images leave the device.</p>${TF?'':'<p><b>TensorFlow.js did not load (offline?).</b></p>'}

function run(){const e=$('res');if(e)e.innerHTML='<p class="mut">\u23f3 Measuring automatically\u2026</p>';const t0=S.t0;S.t0=0;
 setTimeout(()=>{try{S.manual=false;
  if(S.side){S.dir=S.side;detect()}else{let b=null;for(const d of[1,-1]){S.dir=d;detect();if(!b||S.edge>b.e)b={e:S.edge,d}}S.dir=b.d;detect()}
  S.conf=(S.loc?(S.iw/cv.width>.05&&S.iw/cv.width<.35):(S.pr/cv.width>.012&&S.pr/cv.width<.22&&S.edge>1.8))?1:0;S.t0=t0;render();aiSuggest();
  if(S.asv){if(S.conf)save();else toast('Low confidence: not auto-saved. Check the markers.')}
 }catch(err){const e2=$('res');if(e2)e2.innerHTML='<p style="color:var(--High)">Could not measure this photo automatically ('+esc(err.message||err)+'). Try a clearer side-view photo.</p>'}},30)}

 return`<svg viewBox="0 0 300 195" class="ch" role="img" aria-label="Live anterior chamber diagram"><path d="M72 22Q30 95 72 168L${lx} 118L${lx} 72Z" fill="#7fc4e0" opacity=".35"/>
 <ellipse cx="${lx+40}" cy="95" rx="40" ry="48" fill="#e6d79b" opacity=".85"/><line x1="72" y1="22" x2="${lx}" y2="72" stroke="#7b5b3a" stroke-width="9" stroke-linecap="round"/><line x1="72" y1="168" x2="${lx}" y2="118" stroke="#7b5b3a" stroke-width="9" stroke-linecap="round"/>
 <path d="M72 22Q30 95 72 168" fill="none" stroke="#c4d2dc" stroke-width="7" stroke-linecap="round"/>
 <circle cx="80" cy="34" r="8" fill="${c}" opacity=".85"><animate attributeName="r" values="6;12;6" dur="1.6s" repeatCount="indefinite"/></circle><circle cx="80" cy="156" r="8" fill="${c}" opacity=".85"><animate attributeName="r" values="6;12;6" dur="1.6s" repeatCount="indefinite"/></circle>
 <line x1="51" y1="95" x2="${lx}" y2="95" stroke="var(--ac)" stroke-width="2" stroke-dasharray="4 3"/><text x="${(51+lx)/2}" y="87" font-size="12" font-weight="700" text-anchor="middle" fill="var(--ink)">ACD ${a.toFixed(2)} mm</text>
